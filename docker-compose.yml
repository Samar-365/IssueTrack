services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: issue_tracker_backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    environment:
      - FLASK_ENV=development
      - PORT=5005
      - SECRET_KEY=issue-tracker-secret-key-change-in-production
      - JWT_SECRET_KEY=jwt-secret-key-change-in-production
      - DATABASE_URL=sqlite:////app/data/issue_tracker.db
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5005/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: issue_tracker_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
    driver: local
