databases:
  - name: issue-tracker-db
    plan: free
    databaseName: issue_tracker
    user: issue_tracker_user

services:
  - type: web
    name: issue-tracker-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd backend && chmod +x build.sh && ./build.sh
    startCommand: cd backend && gunicorn -b 0.0.0.0:$PORT -w 2 --threads 4 --timeout 120 "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: issue-tracker-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://your-app.vercel.app  # <-- update after Vercel deploy
      - key: PYTHON_VERSION
        value: "3.11.0"
